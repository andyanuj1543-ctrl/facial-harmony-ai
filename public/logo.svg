<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Golden Ratio Grid Ring -->
  <circle cx="60" cy="58" r="40" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="60" cy="58" r="25" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" />

  <!-- Central Vertical Symmetry Midline -->
  <line x1="60" y1="24" x2="60" y2="92" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="2 2" stroke-opacity="0.6" />

  <!-- Stylized Geometric Face Contours -->
  <!-- Forehead to Cheekbone to Jawline to Chin -->
  <path d="M 42 36 C 42 36, 60 30, 78 36 C 85 45, 87 56, 84 68 C 81 78, 70 85, 60 90 C 50 85, 39 78, 36 68 C 33 56, 35 45, 42 36 Z" 
        stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Golden Ratio Proportional Caliper / Chevron Overlays -->
  <!-- Eye line horizontal -->
  <line x1="42" y1="52" x2="78" y2="52" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="48" cy="52" r="2.5" fill="#38bdf8" />
  <circle cx="72" cy="52" r="2.5" fill="#38bdf8" />

  <!-- Nose apex -->
  <circle cx="60" cy="65" r="2" fill="#f59e0b" />

  <!-- Lip line -->
  <line x1="52" y1="74" x2="68" y2="74" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />

  <!-- Precision Measurement Target Nodes -->
  <circle cx="60" cy="31" r="2.5" fill="#fef08a" />
  <circle cx="60" cy="90" r="3" fill="#f59e0b" />
  <circle cx="36" cy="68" r="2" fill="#f59e0b" />
  <circle cx="84" cy="68" r="2" fill="#f59e0b" />
</svg>
